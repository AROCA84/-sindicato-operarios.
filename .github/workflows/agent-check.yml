name: Agent scaffold checks

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate JSON catalogs
        run: |
          node -e "JSON.parse(require('node:fs').readFileSync('config/repositories.json','utf8'))"
          node -e "JSON.parse(require('node:fs').readFileSync('config/upstreams.json','utf8'))"
          node -e "JSON.parse(require('node:fs').readFileSync('config/tasks.json','utf8'))"
      - name: Run tests
        run: npm test
      - name: Smoke test read-only commands
        run: |
          npm run repos
          npm run plan
          npm run tasks
      - name: Audit primary website in read-only mode
        run: |
          mkdir -p artifacts
          set -o pipefail
          npm run audit -- AROCA84/-sindicato-operarios | tee artifacts/primary-web-audit.txt
      - name: Upload read-only audit report
        uses: actions/upload-artifact@v4
        with:
          name: primary-web-readonly-audit
          path: artifacts/primary-web-audit.txt
          if-no-files-found: error
          retention-days: 14
