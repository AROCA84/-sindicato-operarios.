name: Agent scaffold checks

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate JSON catalogs
        run: |
          node -e "JSON.parse(require('node:fs').readFileSync('config/repositories.json','utf8'))"
          node -e "JSON.parse(require('node:fs').readFileSync('config/upstreams.json','utf8'))"
      - name: Run tests
        run: npm test
